name: Update latest Velog posts

on:
  schedule:
    # 매주 월요일 04:12 한국 시간 (UTC 일요일 19:12)
    - cron: '12 19 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-velog-posts
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Update latest Velog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: 'https://v2.velog.io/rss/@yugyeong2'
          readme_path: './README.md'
          max_post_count: '5'
          retry_count: '3'
          retry_wait_time: '10'
          enable_keepalive: 'false'
          commit_message: 'docs: update latest Velog posts'
